<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="息を吹きかけると、タロットカードが3枚決まります。">
<meta name="theme-color" content="#0d1020">
<title>タロットカード</title>
<style>
:root{--bg:#0d1020;--bg2:#141a33;--panel:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--ink:#efe9da;--dim:#8f91ad;--gold:#d8bd7a;--gold2:#b8955a;--cw:min(66vw,290px,27svh);--sw:min(28vw,170px,20svh);--serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;background:var(--bg);overflow-x:clip}
body{position:relative;background:var(--bg);overflow-x:clip;color:var(--ink);font-family:var(--sans);line-height:1.6;display:flex;flex-direction:column;align-items:center;justify-content:safe center;min-height:100%;height:auto;padding:28px 18px calc(28px + env(safe-area-inset-bottom));text-align:center;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
/* 背景: 柔らかい光とごく薄い粒子 */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
.bg .a{width:70vw;height:70vw;max-width:520px;max-height:520px;left:-15vw;top:-10vh;background:#26306a}
.bg .b{width:60vw;height:60vw;max-width:460px;max-height:460px;right:-20vw;top:30vh;background:#3a2a5e;opacity:.4}
.bg .c{width:50vw;height:50vw;max-width:380px;max-height:380px;left:20vw;bottom:-15vh;background:#1b3a5a;opacity:.35}
.bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.35) .6px,transparent .7px),radial-gradient(rgba(255,255,255,.22) .5px,transparent .6px);background-size:160px 160px,97px 97px;background-position:0 0,40px 70px;opacity:.5}
body>*:not(.bg):not(.sheet):not(.shade){position:relative;z-index:1}
.hidden{display:none!important}
/* 見出し */
header{margin-bottom:26px}
h1{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:.3em;margin-left:.3em;color:var(--ink);line-height:1}
.tag{font-size:11px;letter-spacing:.3em;margin-left:.3em;color:var(--dim);margin-top:10px}
/* 山札 */
.deck{width:var(--cw);margin:6px auto 30px;position:relative}
.deck::before{content:"";position:absolute;left:50%;top:50%;width:min(150%,90vw);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:1px solid rgba(216,189,122,.12);pointer-events:none}
.deck::after{content:"";position:absolute;left:50%;top:50%;width:min(190%,96vw);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:1px solid rgba(216,189,122,.06);pointer-events:none}
.halo{position:absolute;left:50%;top:60%;width:min(120%,90vw);height:60%;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(216,189,122,.22),transparent 65%);filter:blur(18px);pointer-events:none;transition:opacity .6s}
.scene{perspective:1200px;width:100%;aspect-ratio:400/665;position:relative;transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.ghost{position:absolute;inset:0;border-radius:4% / 2.3%;border:1.5px solid rgba(216,189,122,.45);transform-origin:50% 110%;pointer-events:none}
.ghost.l{animation:swayL 5s ease-in-out infinite}
.ghost.r{animation:swayR 5.6s ease-in-out infinite}
.ghost.l2{animation:swayL 7s ease-in-out infinite reverse;opacity:.45}
.ghost.r2{animation:swayR 7.4s ease-in-out infinite reverse;opacity:.45}
.blowing .ghost{animation-duration:.7s!important}
@keyframes swayL{0%,100%{transform:rotate(-5deg) translateX(-4%)}50%{transform:rotate(-10deg) translateX(-9%)}}
@keyframes swayR{0%,100%{transform:rotate(5deg) translateX(4%)}50%{transform:rotate(10deg) translateX(9%)}}
.card{position:relative;z-index:1;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.3s cubic-bezier(.4,0,.15,1);cursor:pointer;touch-action:none;transform:rotate(var(--tilt,0deg)) translate(var(--dx,0px),var(--dy,0px)) rotateY(0)}
.idle .deck .card{animation:floaty 5s ease-in-out infinite}
@keyframes floaty{0%,100%{translate:0 0;rotate:-1.2deg}50%{translate:0 -8px;rotate:1.2deg}}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:4% / 2.3%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 24px 60px rgba(0,0,0,.6),0 2px 0 rgba(255,255,255,.06) inset}
.back{background:linear-gradient(160deg,#1a2048,#0f1330 55%,#141a3c)}
.back svg{position:absolute;inset:0;width:100%;height:100%}
.back img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.deck .back::after{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 30% 35%,rgba(239,233,218,.14),transparent 45%),radial-gradient(circle at 70% 70%,rgba(216,189,122,.12),transparent 40%);animation:mist 10s ease-in-out infinite;pointer-events:none}
@keyframes mist{0%,100%{transform:translate(0,0) rotate(0)}33%{transform:translate(8%,-6%) rotate(10deg)}66%{transform:translate(-7%,5%) rotate(-8deg)}}
.tick{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(13,16,32,.78);color:var(--gold);font-family:var(--serif);font-size:calc(var(--cw) * .09);letter-spacing:.12em;padding:0 8%;line-height:1.3}
.blowing .tick{display:flex}
.blowing .deck .back::after{display:none}
.front{background:#f4edd8;transform:rotateY(180deg)}
.front img{width:100%;height:100%;display:block;object-fit:cover;opacity:0;transition:opacity .4s}
.front img.on{opacity:1}
.rev .front img{transform:rotate(180deg)}
.pulse .face{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 0 rgba(216,189,122,0)}50%{box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 8px rgba(216,189,122,.10)}}
/* 3枚 */
.spread{display:flex;gap:14px;justify-content:center;align-items:flex-start;margin-bottom:26px}
.slot{width:var(--sw);position:relative;animation:deal .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes deal{from{opacity:0;translate:0 -40px;scale:.6}to{opacity:1;translate:0 0;scale:1}}
.slot.zoom{z-index:5}
.slot.zoom .scene{transform:scale(1.7) translateX(var(--zx,0))}
.slot .card.todo .face{animation:pulse 3s ease-in-out infinite}
.pos{font-family:var(--serif);font-size:11px;color:var(--dim);margin-top:10px;letter-spacing:.25em;min-height:1.2em}
.cname{font-size:12px;margin-top:2px;min-height:1.2em;color:var(--ink)}
/* 案内 */
.fig{display:none;margin:0 auto 10px;width:190px;height:auto}
.listen .fig{display:block}
.fig .air{stroke-dasharray:6 6;animation:air 1.2s linear infinite}
@keyframes air{to{stroke-dashoffset:-24}}
.meter{width:var(--cw);max-width:290px;height:2px;background:rgba(255,255,255,.08);border-radius:2px;margin:0 auto 16px;overflow:hidden;visibility:hidden}
.meter i{display:block;height:100%;width:0;background:var(--gold);transition:width .08s}
.msg{min-height:2.6em;font-family:var(--serif);font-size:20px;letter-spacing:.08em;max-width:20em;line-height:1.5}
.sub{font-size:12px;color:var(--dim);margin-top:10px;max-width:24em;letter-spacing:.04em}
.sub a,button.link{color:var(--gold);background:none;border:0;font:inherit;text-decoration:none;border-bottom:1px solid rgba(216,189,122,.5);cursor:pointer;padding:0}
.done .msg{display:none}
/* ボタン */
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btns button,.acts .main{background:linear-gradient(180deg,#e2c98a,#c9a860);color:#1a1630;border:0;border-radius:28px;padding:12px 26px;font:inherit;font-size:15px;font-weight:600;letter-spacing:.04em;cursor:pointer;box-shadow:0 10px 30px rgba(216,189,122,.18);transition:transform .15s,box-shadow .15s}
.btns button:active,.acts .main:active{transform:scale(.97)}
.btns button.ghostbtn,.subacts button{background:transparent;color:var(--gold);border:1px solid rgba(216,189,122,.45);box-shadow:none;font-weight:500}
.topai{flex-direction:column;align-items:center;gap:8px;margin:-4px 0 26px}
.topai button{padding:14px 30px;font-size:16px}
/* 結果 */
.result{max-width:30em;width:100%}
.reading{display:flex;gap:16px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:12px;animation:fade .6s both;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.reading img{width:62px;flex:none;border-radius:5px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.reading img.rev{transform:rotate(180deg)}
.reading .t{min-width:0}
.reading .p{font-family:var(--serif);font-size:11px;color:var(--dim);letter-spacing:.25em}
.reading h2{font-family:var(--serif);font-size:20px;font-weight:500;letter-spacing:.08em;display:inline;margin-right:8px}
.reading .en{font-size:10px;color:var(--dim);letter-spacing:.2em;text-transform:uppercase}
.badge{display:inline-block;font-size:11px;padding:0 9px;border:1px solid rgba(216,189,122,.6);border-radius:12px;color:var(--gold);vertical-align:3px}
.badge.r{border-color:rgba(214,122,122,.6);color:#e0a0a0}
.reading p{font-size:14px;margin-top:6px;line-height:1.6;color:#dcd6c8}
.ai{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;animation:fade .6s both}
.ai details{margin-top:12px;font-size:12px;color:var(--dim)}
.ai summary{cursor:pointer}
.ai textarea{width:100%;height:11em;margin-top:8px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;font-size:12px;line-height:1.5;padding:8px 10px;user-select:text;-webkit-user-select:text}
.again{margin-top:22px}
.note{font-size:12px;color:var(--dim);margin-top:10px;min-height:1.2em}
/* シート */
.shade{position:fixed;inset:0;background:rgba(5,6,16,.6);z-index:20;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#161b36;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:22px 20px calc(18px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;box-shadow:0 -10px 50px rgba(0,0,0,.6);animation:up .35s cubic-bezier(.2,.8,.2,1);text-align:left;max-height:88svh;overflow-y:auto}
@keyframes up{from{transform:translateY(100%)}}
.sheet h3{font-family:var(--serif);font-size:17px;font-weight:500;letter-spacing:.1em;margin-bottom:14px}
.sheet .close{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--dim);font-size:24px;cursor:pointer;line-height:1;padding:4px 8px}
.grp{margin-bottom:14px}
.lbl{font-size:11px;color:var(--dim);margin-bottom:7px;letter-spacing:.15em}
.lbl small{font-size:10px;margin-left:6px;opacity:.8;letter-spacing:0}
.lbl small.multi{color:var(--gold);opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);border-radius:18px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;transition:background .15s}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1630;font-weight:600}
.sheet input{width:100%;margin-top:10px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;font-size:15px;padding:10px 12px;user-select:text;-webkit-user-select:text}
.sheet input::placeholder{color:#6f6d8c}
.acts{margin-top:8px}
.acts .main{width:100%;padding:15px;font-size:17px;border-radius:30px}
.subacts{display:flex;gap:10px;margin-top:10px}
.subacts button{flex:1;border-radius:22px;padding:10px;font:inherit;font-size:14px;cursor:pointer}
footer{margin-top:44px;font-size:10px;color:#5f6180;line-height:1.9;letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){.card{transition:transform .2s}.pulse .face,.slot .card.todo .face,.idle .deck .card,.ghost,.deck .back::after,.fig .air,.slot{animation:none}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i></div>
<header><h1>タロットカード</h1><p class="tag">ひと息で引く、三枚のタロット</p></header>
<div class="deck" id="deck"><div class="halo"></div><div class="scene">
  <div class="ghost l2"></div><div class="ghost r2"></div><div class="ghost l"></div><div class="ghost r"></div>
  <div class="card pulse" id="deckcard" role="button" tabindex="0" aria-label="山札">
    <div class="face back"><svg viewBox="0 0 400 665" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="14" y="14" width="372" height="637" rx="10" fill="none" stroke="#d8bd7a" stroke-width="1.6"/><rect x="24" y="24" width="352" height="617" rx="7" fill="none" stroke="#d8bd7a" stroke-width=".7" opacity=".7"/><circle cx="200" cy="332" r="92" fill="none" stroke="#d8bd7a" stroke-width=".8" opacity=".6"/><circle cx="200" cy="332" r="60" fill="none" stroke="#d8bd7a" stroke-width=".8" opacity=".8"/><g stroke="#d8bd7a" stroke-width="1.2" stroke-linecap="round"><path d="M200 292v80M160 332h80M172 304l56 56M228 304l-56 56"/></g><circle cx="200" cy="332" r="5" fill="#d8bd7a"/><g fill="#d8bd7a" opacity=".8"><circle cx="200" cy="70" r="2"/><circle cx="200" cy="595" r="2"/><circle cx="60" cy="332" r="2"/><circle cx="340" cy="332" r="2"/></g><g fill="none" stroke="#d8bd7a" stroke-width=".8" opacity=".55"><path d="M40 40h30M40 40v30M360 40h-30M360 40v30M40 625h30M40 625v-30M360 625h-30M360 625v-30"/></g></svg><img alt="" src="cards/back.webp" onerror="this.remove()"><div class="tick" id="tick"></div></div>
    <div class="face front"></div>
  </div>
</div></div>
<div class="spread hidden" id="spread"></div>
<svg class="fig" viewBox="0 0 200 100" aria-hidden="true">
  <circle cx="40" cy="50" r="24" fill="none" stroke="#ece6d6" stroke-width="2.5"/>
  <path d="M62 44 l7 6 l-7 6" fill="none" stroke="#ece6d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="air" d="M74 50 C 95 40, 110 60, 132 50" fill="none" stroke="#c8a44c" stroke-width="2.5" stroke-linecap="round"/>
  <path class="air" d="M74 42 C 95 30, 110 50, 130 40" fill="none" stroke="#c8a44c" stroke-width="2" stroke-linecap="round" opacity=".6"/>
  <path class="air" d="M74 58 C 95 50, 110 70, 130 60" fill="none" stroke="#c8a44c" stroke-width="2" stroke-linecap="round" opacity=".6"/>
  <rect x="140" y="14" width="44" height="76" rx="7" fill="none" stroke="#ece6d6" stroke-width="2.5"/>
  <rect x="146" y="22" width="32" height="56" rx="2" fill="rgba(236,230,214,.12)"/>
  <circle cx="162" cy="85" r="2.2" fill="#c8a44c"/>
  <text x="162" y="99" font-size="8" fill="#9a97b4" text-anchor="middle">マイク</text>
</svg>
<div class="meter" id="meter"><i id="level"></i></div>
<p class="msg" id="msg"></p>
<p class="sub" id="sub"></p>
<div class="btns topai hidden" id="topai"><button id="open1" type="button">この三枚で、AI に占ってもらう</button></div>
<section class="result"><div id="readings"></div>
  <div class="ai hidden" id="ai">
    <div class="btns"><button id="open2" type="button">この三枚で、AI に占ってもらう</button></div>
    <p class="note" id="note"></p>
    <details><summary>送る内容を見る・直す</summary><textarea id="prompt"></textarea></details>
  </div>
  <div class="btns again hidden" id="againwrap"><button id="again" type="button" class="ghostbtn">最初から</button></div>
</section>
<div class="shade hidden" id="shade"></div>
<section class="sheet hidden" id="sheet" role="dialog" aria-label="占いの設定">
  <button class="close" id="close" type="button" aria-label="閉じる">×</button>
  <h3>この三枚で占う</h3>
  <div class="grp"><div class="lbl">テーマ <small class="multi">複数選べます</small></div><div class="chips" id="theme"></div><input id="q" type="text" maxlength="80" class="hidden" placeholder="占いたいことを書く 例: 今の仕事を続けるべき?"></div>
  <div class="grp"><div class="lbl">性別 <small>任意。言葉づかいが合いやすくなります</small></div><div class="chips" id="sex"></div></div>
  <div class="grp"><div class="lbl">年代 <small>任意</small></div><div class="chips" id="age"></div></div>
  <div class="acts"><button id="gpt" type="button" class="main">ChatGPT で占う</button><div class="subacts"><button id="gemini" type="button" class="ghostbtn">Gemini で占う</button><button id="copy" type="button" class="ghostbtn">プロンプトをコピー</button></div></div>
  <p class="note" id="note2"></p>
</section>
<footer>音は端末の中だけで使い、保存も送信もしません。<br>Art: Pamela Colman Smith, 1909 · Text: A. E. Waite, 1911</footer>
<script>
const C=[
["愚者","The Fool","考えるより先に飛び出す時。無邪気さと勢いが、思いがけない方向へ連れていく。","軽はずみ、うっかり、気の抜けた状態。足元を見ずに進んでいないか確かめて。"],
["魔術師","The Magician","技能、機転、巧みな対応。意志と自信があれば、手持ちの道具で道は開ける。","見せかけの技、落ち着かない心、自信の空回り。不調や評判の低下にも注意。"],
["女教皇","The High Priestess","秘密、まだ明かされない未来。沈黙と忍耐、そして静かな知恵が答えを運ぶ。","情熱が先走る。表面的な知識やうぬぼれが、本当の答えを見えなくする。"],
["女帝","The Empress","実り、行動、長く続く豊かさ。始めたことが育つ。隠れた事情には注意。","真実が明るみに出て、もつれが解ける。喜び。ただし心が揺れやすい時。"],
["皇帝","The Emperor","安定、力、守り、実現。理性と信念で物事を動かせる。頼れる人の助けも。","思いやりと寛大さ。一方で混乱や妨げ、まだ力が足りない未熟さも。"],
["教皇","The Hierophant","結びつき、約束、ならわし。慈悲と善意。頼りになる相談相手が現れる。","人のつながりは良好だが、親切すぎて弱くなる。形だけの付き合いに注意。"],
["恋人","The Lovers","引き合う心、愛、美しさ。試練を乗り越えて結ばれる。","失敗、愚かな計画。望んだ結びつきが思うように進まない。食い違いの多い時。"],
["戦車","The Chariot","救い、導き、勝利。ただし思い上がりや争い、仕返しの気持ちには注意。","騒ぎ、口論、争い、訴え。無理に押し通すと敗れる。"],
["力","Strength","力、気力、行動、勇気、度量の大きさ。完全な成功と名誉。","力の乱用、横暴。あるいは弱さと不和。評判を落とすこともある。"],
["隠者","The Hermit","慎重さ、用心深さ。ただし裏切りや隠しごと、ごまかしにも気をつけて。","隠しごと、偽り、駆け引き。理由のない恐れと、行き過ぎた用心。"],
["運命の輪","Wheel of Fortune","運命、幸運、成功、引き上げられる時。巡り合わせが味方する。","増える、満ちる、余りある。度を越した豊かさには注意。"],
["正義","Justice","公平、正しさ、誠実。正しい側が認められ、筋の通った結果が出る。","法や手続きの複雑さ、偏り、かたくなさ、厳しすぎる裁き。"],
["吊るされた男","The Hanged Man","知恵、慎重さ、見極める目。試練と犠牲のあとに、直感とひらめきが来る。","自分本位。周りに流され、群れの中で自分を見失う。"],
["死神","Death","終わり、ひとつの区切り、崩れて変わる時。失うものがあるが、次が始まる。","動けない、眠ったまま、立ちすくむ。希望が失われたように感じる時。"],
["節制","Temperance","節度、やりくり、ほどよい調整。無理なく組み合わせてうまく進める。","信仰や儀式にまつわること。分裂、うまくいかない組み合わせ、利害の衝突。"],

// ---- 乱数: 材料 → SHA-256 → ブラウザ乱数と混ぜて SHA-256 → 重複なしで3枚と向き ----
async function digest(b){return new Uint8Array(await crypto.subtle.digest("SHA-256",b));}
async function pick3(material){
  let h;
  if(crypto.subtle){
    const h1=await digest(material);
    const mix=new Uint8Array(64);mix.set(h1);mix.set(crypto.getRandomValues(new Uint8Array(32)),32);
    h=await digest(mix);
  }else h=crypto.getRandomValues(new Uint8Array(32));
  const rest=[];for(let i=0;i<78;i++)rest.push(i);
  const out=[];let i=0,round=0;
  while(out.length<3){
    if(i>=h.length-1){const again=new Uint8Array(33);again.set(h);again[32]=round++;h=crypto.subtle?await digest(again):crypto.getRandomValues(new Uint8Array(32));i=0;}
    const m=rest.length,lim=256-(256%m);   // m で割り切れる範囲だけ使い、どのカードも同じ確率にする
    if(h[i]<lim){out.push({n:rest.splice(h[i]%m,1)[0],rev:(h[i+1]&1)===1});i+=2;}else i++;
  }
  return out;
}
function f64(arr){return new Uint8Array(new Float64Array(arr).buffer);}
function concat(...parts){const n=parts.reduce((s,p)=>s+p.length,0),o=new Uint8Array(n);let i=0;for(const p of parts){o.set(p,i);i+=p.length;}return o;}

// ---- 3枚を決めて並べる ----
async function finish(material){
  setState("dealt");stopMic();cancelAnimationFrame(raf);meter.style.visibility="hidden";
  drawn=await pick3(material);
  deck.classList.add("hidden");spread.classList.remove("hidden");spread.innerHTML="";
  drawn.forEach((d,i)=>{
    const el=document.createElement("div");el.className="slot";el.style.setProperty("--zx",i===0?"28%":i===2?"-28%":"0");
    el.innerHTML='<div class="scene"><div class="card todo" role="button" tabindex="0" aria-label="'+POS[i]+'のカード(裏向き)">'+
      '<div class="face back">'+BACK+'<img alt="" src="cards/back.webp" onerror="this.remove()"></div>'+
      '<div class="face front"><img alt=""></div></div></div><div class="pos">'+POS[i]+'</div><div class="cname"></div>';
    el.style.animationDelay=(i*150)+"ms";
    d.slot=el;d.card=el.querySelector(".card");d.art=el.querySelector(".front img");d.shown=false;
    d.art.src="cards/"+String(d.n).padStart(2,"0")+".webp";   // 決まった3枚だけ先に読み込む
    d.art.onload=()=>d.art.classList.add("on");
    d.card.addEventListener("click",()=>reveal(d,i));
    d.card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();reveal(d,i);}});
    spread.appendChild(el);
  });
  setMsg("一枚ずつ、めくる","順番は自由です。");
}
function reveal(d,i){
  if(state!=="dealt"||d.shown||busy)return;
  d.shown=true;busy=true;
  const c=C[d.n];
  d.card.classList.remove("todo");d.card.classList.toggle("rev",d.rev);
  d.slot.classList.add("zoom");
  setTimeout(()=>d.card.classList.add("flipped"),450);
  setTimeout(()=>{
    d.slot.querySelector(".cname").textContent=c[0]+(d.rev?" (逆)":"");
    const item=document.createElement("article");item.className="reading";
    item.innerHTML='<img alt="" class="'+(d.rev?"rev":"")+'" src="'+d.art.src+'"><div class="t"><div class="p">'+(i+1)+". "+POS[i]+'</div><h2></h2>'+
      '<span class="badge'+(d.rev?" r":"")+'">'+(d.rev?"逆位置":"正位置")+'</span><div class="en"></div><p></p></div>';
    item.querySelector("h2").textContent=c[0];item.querySelector(".en").textContent=c[1];item.querySelector("p").textContent=d.rev?c[3]:c[2];
    item.dataset.i=i;
    const next=[...$("readings").children].find(x=>Number(x.dataset.i)>i);
    $("readings").insertBefore(item,next||null);
  },1800);
  setTimeout(()=>{
    d.slot.classList.remove("zoom");busy=false;
    if(drawn.every(x=>x.shown)){
      setState("done");setMsg("","");
      $("ai").classList.remove("hidden");$("againwrap").classList.remove("hidden");$("topai").classList.remove("hidden");
      buildPrompt();
    }
  },2400);
}

        else{sel.theme=sel.theme.filter(t=>t!=="特になし");sel.theme=sel.theme.includes(v)?sel.theme.filter(t=>t!==v):[...sel.theme,v];if(!sel.theme.length)sel.theme=["特になし"];}
        $("q").classList.toggle("hidden",!sel.theme.includes("自分で書く"));if(v==="自分で書く"&&sel.theme.includes(v))$("q").focus();
      }else{sel[key]=v;try{localStorage.setItem("tarot-me",JSON.stringify({sex:sel.sex,age:sel.age}));}catch(e){}}
      [...box.children].forEach(c=>c.classList.toggle("on",on(c.textContent)));
      buildPrompt();});
    box.appendChild(b);});
}
chips("theme",THEMES.map(t=>t[0]),"theme");chips("sex",SEXES,"sex");chips("age",AGES,"age");
function openSheet(){buildPrompt();$("shade").classList.remove("hidden");$("sheet").classList.remove("hidden");}
function closeSheet(){$("shade").classList.add("hidden");$("sheet").classList.add("hidden");}
$("open1").addEventListener("click",openSheet);$("open2").addEventListener("click",openSheet);
$("close").addEventListener("click",closeSheet);$("shade").addEventListener("click",closeSheet);

// ---- AI 用プロンプト ----
function buildPrompt(){
  const q=$("q").value.trim();
  const who=[sel.age!=="答えない"?sel.age:"",sel.sex!=="答えない"?sel.sex:""].filter(Boolean).join("の");
  const picked=sel.theme.filter(t=>t!=="特になし"&&t!=="自分で書く");
  const parts=picked.map(t=>t+"について。"+(THEMES.find(x=>x[0]===t)||["",""])[1]);
  if(sel.theme.includes("自分で書く")&&q)parts.push(q);
  const topic=parts.length?parts.join("\n"):"特に決めていません。今の自分へのメッセージとして読んでください。";
  const lines=drawn.map((d,i)=>{const c=C[d.n];return (i+1)+". "+POS[i]+": "+c[0]+"("+c[1]+")"+(d.rev?" 逆位置":" 正位置")+" — "+(d.rev?c[3]:c[2]);});
  $("prompt").value=
"タロット占いをお願いします。ウェイト=スミス版で3枚引き(状況・課題・助言)をしました。\n\n"+
(who?"相談者: "+who+"\n":"")+"占いたいこと:\n"+topic+"\n\n"+
lines.join("\n")+"\n\n"+
"それぞれのカードの意味と、3枚のつながりを踏まえて、やさしい言葉で読み解いてください。最後に、今日できる小さな一歩をひとつ提案してください。";
  return $("prompt").value;
}
$("q").addEventListener("input",buildPrompt);
async function copyPrompt(){
  const t=$("prompt").value;
  try{await navigator.clipboard.writeText(t);}catch(e){$("prompt").select();document.execCommand("copy");}
}
const openGPT=()=>{window.open("https://chatgpt.com/?q="+encodeURIComponent(buildPrompt()),"_blank","noopener");};
$("gpt").addEventListener("click",openGPT);
$("gemini").addEventListener("click",async()=>{buildPrompt();await copyPrompt();$("note2").textContent="プロンプトをコピーしました。Gemini に貼り付けて送信してください。";window.open("https://gemini.google.com/app","_blank","noopener");});
$("copy").addEventListener("click",async()=>{buildPrompt();await copyPrompt();$("note2").textContent="コピーしました。好きな AI に貼り付けてください。";});
$("again").addEventListener("click",idle);

// ---- 息で引く ----
async function startListen(){
  setState("listen");deckcard.classList.remove("pulse");
  setMsg("マイクを準備しています…","");
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(e){
    setMsg("マイクが使えないので、指で混ぜて引きます。","");
    return setTimeout(startMix,900);
  }
  if(state!=="listen")return stopMic();
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  await ac.resume();
  const src=ac.createMediaStreamSource(stream),an=ac.createAnalyser();
  an.fftSize=2048;src.connect(an);
  const buf=new Uint8Array(an.fftSize),chunks=[];
  let t0=performance.now(),ambient=0,amb=0,th=0.012,above=0,below=0,blowing=false,tStart=0,frame=0,lastHint=0;
  setMsg("マイクに、ふーっと息を吹きかける","");meter.style.visibility="visible";
  const tick=()=>{
    if(state!=="listen")return;
    const now=performance.now();
    an.getByteTimeDomainData(buf);
    let s=0;for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;s+=v*v;}
    const rms=Math.sqrt(s/buf.length);
    if(now-t0<400){ambient+=rms;amb++;th=Math.min(0.05,Math.max(0.008,(ambient/amb)*1.6));raf=requestAnimationFrame(tick);return;}
    const k=Math.min(1,rms/(th*4));level.style.width=(k*100).toFixed(0)+"%";
    if(rms>th){above+=16;below=0;}else{below+=16;above=0;}
    if(!blowing&&above>=250){blowing=true;tStart=now;body.classList.add("blowing");setMsg("そのまま…","カードが混ざっています");}
    if(blowing){
      if(chunks.length<120)chunks.push(buf.slice());
      deckcard.style.setProperty("--tilt",((Math.random()-.5)*k*10).toFixed(2)+"deg");
      deckcard.style.setProperty("--dx",((Math.random()-.5)*k*12).toFixed(1)+"px");
      deckcard.style.setProperty("--dy",((Math.random()-.5)*k*8).toFixed(1)+"px");
      if(frame++%3===0)$("tick").textContent=C[Math.floor(Math.random()*78)][0];
      if(below>=400||now-tStart>4000){body.classList.remove("blowing");ac.close();return finish(concat(...chunks,f64([tStart,now,Date.now()])));}
    }else if(now-t0>12000&&!lastHint){lastHint=1;setMsg("マイクに、ふーっと息を吹きかける",'反応しないときは <button class="link" id="finger2" type="button">指で混ぜて引く</button>');$("finger2").addEventListener("click",e=>{e.stopPropagation();ac.close();startMix();});}
    raf=requestAnimationFrame(tick);
  };
  raf=requestAnimationFrame(tick);
}
function stopMic(){body.classList.remove("blowing");if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}

// ---- 指で混ぜる ----
function startMix(){
  stopMic();cancelAnimationFrame(raf);setState("mix");fingerPts=[];deckcard.classList.remove("pulse");meter.style.visibility="visible";level.style.width="0";
  setMsg("カードを指でぐるぐるなでる","指の動きでカードが混ざり、3枚が決まります。");
}
function mixMove(e){
  if(state!=="mix"||!(e.buttons&1||e.pointerType==="touch"))return;
  fingerPts.push(e.clientX,e.clientY,performance.now());
  const k=Math.min(1,fingerPts.length/150);level.style.width=(k*100).toFixed(0)+"%";
  deckcard.style.setProperty("--tilt",((Math.random()-.5)*k*8).toFixed(2)+"deg");
  if(fingerPts.length>=150)finish(concat(f64(fingerPts),f64([Date.now()])));
}
deckcard.addEventListener("pointermove",mixMove,{passive:true});
deckcard.addEventListener("pointerdown",e=>{if(state==="mix")mixMove(e);});
deckcard.addEventListener("pointerup",()=>{if(state==="mix"&&fingerPts.length>=60)finish(concat(f64(fingerPts),f64([Date.now()])));});
addEventListener("pagehide",stopMic);
idle();
</script>
